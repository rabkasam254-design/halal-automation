# Демо-конфиг для тестового бота HalalAI
name: "HalalAI Demo"
business_type: "food_delivery"
language: "ru"

# Telegram Bot Token — вставьте сюда токен от @BotFather
telegram_token: "CHANGE_ME"

# Hermes API Server
hermes_api_url: "http://localhost:8642"
api_server_key: "hermes-local-12345"

# Приветствие
welcome_message: |
  Ассаламу алейкум! 🌙
  Добро пожаловать в HalalAI Demo!
  Я — AI-помощник. Могу ответить на вопросы, показать меню и принять заказ.

# Контактная информация
contact_info:
  phone: "+998901234567"
  address: "Ташкент, demo-локация"
  instagram: "@halal_ai_demo"

# Частые вопросы
faq:
  - q: "Как сделать заказ?"
    a: "Напишите название блюда и ваш адрес. Мы подтвердим заказ в течение 5 минут."
  - q: "Какое время работы?"
    a: "Ежедневно с 9:00 до 23:00"
  - q: "Сколько стоит доставка?"
    a: "Доставка бесплатная при заказе от 50,000 сум"
  - q: "Какая кухня?"
    a: "Узбекская, турецкая, европейская — всё халяль"

# Товары (для каталога)
products:
  - name: "Лагман"
    price: "30,000"
    description: "Домашняя лапша с говядиной и овощами"
  - name: "Шаурма"
    price: "25,000"
    description: "Куриная шаурма в лаваше"
  - name: "Самса"
    price: "8,000"
    description: "Самса с говядиной и луком"
  - name: "Плов"
    price: "35,000"
    description: "Узбекский плов с бараниной"

# ID админов (получить: @userinfobot)
admin_ids:
  - 0  # TODO: заменить на свой Telegram ID

# Инструкция для Hermes AI
hermes_prompt: |
  Ты — AI-помощник демо-магазина HalalAI Demo.
  Твои задачи:
  - Принимать заказы
  - Отвечать на вопросы о меню
  - Сообщать время доставки
  - Быть вежливым и доброжелательным
  - Использовать Исламские приветствия (Ассаламу алейкум)
  
  Если вопрос сложный — предложи связаться с оператором.
  Все цены в узбекских сумах.
